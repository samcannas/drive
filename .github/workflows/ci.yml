name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned to the toolchain the team develops with, so clippy/rustfmt in CI match local runs.
  # Bump it deliberately (and fix the new lints) rather than following `stable`.
  RUST_TOOLCHAIN: 1.94.1
  RUST_BACKTRACE: short
  # Not RCLONE_*: rclone reads every RCLONE_<FLAG> variable as a command-line flag.
  RCLONE_RELEASE: v1.76.0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Linux packages (FUSE, WebKitGTK 4.1, appindicator)
        if: runner.os == 'Linux'
        timeout-minutes: 15 # mirrors occasionally hang; fail fast instead of stalling the job
        run: |
          # Each attempt is capped; a hung mirror connection is retried instead of blocking.
          apt() { for i in 1 2 3; do sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" && return 0; echo "apt-get $1 failed (attempt $i), retrying"; sleep 10; done; return 1; }
          # Plain-HTTP Ubuntu mirrors (azure.archive / archive / security) are sometimes
          # unreachable from GitHub's runners while HTTPS works: use an HTTPS mirror.
          sudo sed -i -E 's#http://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt update
          apt install -y --no-install-recommends \
            fuse3 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - name: Make /dev/fuse usable
        if: runner.os == 'Linux'
        run: |
          sudo modprobe fuse || true
          test -c /dev/fuse
          sudo chmod 666 /dev/fuse
          grep -q '^user_allow_other' /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
          ls -l /dev/fuse "$(command -v fusermount3)"

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Download rclone ${{ env.RCLONE_RELEASE }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then plat=windows-amd64; exe=rclone.exe; else plat=linux-amd64; exe=rclone; fi
          dir="$(cd "$RUNNER_TEMP" && pwd)"
          curl -fsSL --retry 3 -o "$dir/rclone.zip" \
            "https://downloads.rclone.org/$RCLONE_RELEASE/rclone-$RCLONE_RELEASE-$plat.zip"
          unzip -q "$dir/rclone.zip" -d "$dir"
          bin="$dir/rclone-$RCLONE_RELEASE-$plat/$exe"
          "$bin" version
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -w "$bin")"; fi
          echo "RCLONE_BIN=$bin" >> "$GITHUB_ENV"

      - name: clippy (drive-core, drive-daemon)
        run: cargo clippy --locked -p drive-core -p drive-daemon --all-targets -- -D warnings

      # Some Windows runner images don't have the Cloud Files filter attached to the work
      # volume, so registering a sync root there fails with ERROR_INVALID_FUNCTION.
      - name: Attach the Cloud Files filter to the work volume
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $vol = $env:GITHUB_WORKSPACE.Substring(0, 2)
          fltmc load CldFlt 2>$null
          fltmc attach CldFlt $vol
          fltmc instances -f CldFlt

      - name: Tests (drive-core, drive-daemon)
        shell: bash
        run: |
          skip=()
          if [ "$RUNNER_OS" = Windows ]; then
            # The runner (Windows Server) can't do the Explorer/shell sync-root registration
            # (0x80070490), so Drive falls back to a native one, and `copy` of a placeholder
            # there fails with "not supported by the cloud sync provider". Passes on Windows 11.
            skip=(--skip platform::windows::tests::cloud_files_show_up_and_download_on_demand)
          fi
          cargo test --locked --no-fail-fast -p drive-core -p drive-daemon -- "${skip[@]}"

      - name: Check the app crate (drive-app)
        shell: bash
        env:
          # The sidecar (binaries/drive-<triple>) is only needed for bundling.
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: |
          # generate_context! embeds the frontend; a placeholder is enough to type-check.
          mkdir -p app/dist
          [ -f app/dist/index.html ] || echo '<!doctype html>' > app/dist/index.html
          cargo check --locked -p drive-app

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
