name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays: includes the shaped-link upload speed tests

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  CARGO_INCREMENTAL: 0
  # Pinned to the toolchain the team develops with, so clippy/rustfmt in CI match local runs.
  # Bump it deliberately (and fix the new lints) rather than following `stable`.
  RUST_TOOLCHAIN: 1.94.1
  RUST_BACKTRACE: short
  # Not RCLONE_*: rclone reads every RCLONE_<FLAG> variable as a command-line flag.
  RCLONE_RELEASE: v1.76.0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Real-time scanning of every file rustc and the linker write slows builds noticeably.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ExclusionPath $env:GITHUB_WORKSPACE, $env:USERPROFILE
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath | Format-List

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # Runs every test binary in parallel (cargo test runs them one after another).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The downloaded .deb files, kept for a week: apt still refreshes its lists and
      # installs as usual, it just skips downloads it already has (the HTTPS mirror is
      # sometimes slow). A miss or a stale file only means apt downloads it again.
      - name: apt cache week
        if: runner.os == 'Linux'
        id: aptweek
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/apt-archives
          key: apt-archives-ubuntu-24.04-${{ steps.aptweek.outputs.week }}

      # (No apt package cache: cache-apt-pkgs-action installed from stale package lists,
      # reported success after 404s and saved an empty cache that later runs then "hit".)
      - name: Install Linux packages (FUSE, WebKitGTK 4.1, appindicator)
        if: runner.os == 'Linux'
        timeout-minutes: 15 # mirrors occasionally hang; fail fast instead of stalling the job
        run: |
          # Each attempt is capped; a hung mirror connection is retried instead of blocking.
          apt() { for i in 1 2 3; do sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" && return 0; echo "apt-get $1 failed (attempt $i), retrying"; sleep 10; done; return 1; }
          # Plain-HTTP Ubuntu mirrors (azure.archive / archive / security) are sometimes
          # unreachable from GitHub's runners while HTTPS works: use an HTTPS mirror.
          sudo sed -i -E 's#http://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          # Faster apt on a throwaway runner: no Contents indexes (tens of MB, only for
          # command-not-found), no translations, no man-db rebuild, no fsync per file.
          sudo rm -f /etc/apt/apt.conf.d/50command-not-found /var/lib/man-db/auto-update
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99-no-translations >/dev/null
          apt update
          mkdir -p ~/apt-archives/partial
          apt install -y --no-install-recommends -o Dpkg::Options::=--force-unsafe-io \
            -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            fuse3 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives

      - name: Make /dev/fuse usable
        if: runner.os == 'Linux'
        run: |
          sudo modprobe fuse || true
          test -c /dev/fuse
          sudo chmod 666 /dev/fuse
          # fusermount3 must be setuid root to mount as the runner user.
          sudo chmod u+s "$(command -v fusermount3)"
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
          ls -l /dev/fuse "$(command -v fusermount3)"

      - uses: Swatinem/rust-cache@v2
        with:
          # v1: started over with the rust-lld linker (v0 caches hold link.exe builds too).
          prefix-key: v1-rust
          # Branches restore main's cache but don't each save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Download rclone ${{ env.RCLONE_RELEASE }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then plat=windows-amd64; exe=rclone.exe; else plat=linux-amd64; exe=rclone; fi
          dir="$(cd "$RUNNER_TEMP" && pwd)"
          curl -fsSL --retry 3 -o "$dir/rclone.zip" \
            "https://downloads.rclone.org/$RCLONE_RELEASE/rclone-$RCLONE_RELEASE-$plat.zip"
          unzip -q "$dir/rclone.zip" -d "$dir"
          bin="$dir/rclone-$RCLONE_RELEASE-$plat/$exe"
          "$bin" version
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -w "$bin")"; fi
          echo "RCLONE_BIN=$bin" >> "$GITHUB_ENV"

      # The whole workspace, the app included (this also type-checks it).
      - name: clippy
        shell: bash
        env:
          # The sidecar (binaries/drive-<triple>) is only needed for bundling.
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: |
          # generate_context! embeds the frontend; a placeholder is enough to type-check.
          mkdir -p app/dist
          [ -f app/dist/index.html ] || echo '<!doctype html>' > app/dist/index.html
          cargo clippy --locked --workspace --all-targets -- -D warnings

      # Some Windows runner images don't have the Cloud Files filter attached to the work
      # volume, so registering a sync root there fails with ERROR_INVALID_FUNCTION.
      - name: Attach the Cloud Files filter to the work volume
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $vol = $env:GITHUB_WORKSPACE.Substring(0, 2)
          fltmc load CldFlt 2>$null
          fltmc attach CldFlt $vol
          fltmc instances -f CldFlt

      - name: Tests (drive-core, drive-daemon)
        shell: bash
        run: |
          filter=()
          if [ "$RUNNER_OS" = Windows ]; then
            # The runner (Windows Server) can't do the Explorer/shell sync-root registration
            # (0x80070490), so Drive falls back to a native one, and `copy` of a placeholder
            # there fails with "not supported by the cloud sync provider". Passes on Windows 11.
            filter=(-E 'not test(cloud_files_show_up_and_download_on_demand)')
          fi
          cargo nextest run --locked --no-fail-fast -p drive-core -p drive-daemon "${filter[@]}"

  # Automatic upload speed on real, kernel-shaped links (crates/drive-core/tests/adaptive_netem.rs):
  # a bloated 8 Mbit/s link with a one-second buffer, and the same speed with a short buffer.
  # Several minutes, so it runs on its own runner, only when the controller, the throttle or
  # these tests change (and weekly / on demand); other pushes skip it in seconds.
  upload-speed:
    name: Upload speed on shaped links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Relevant changes?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${PR_BASE:-$BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          if git diff --name-only "$base" HEAD | grep -qE 'engine/(adaptive|throttle)|tests/adaptive_netem|workflows/ci\.yml'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "nothing that affects upload speed changed: skipping"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@master
        if: steps.changed.outputs.run == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          prefix-key: v1-rust
          shared-key: netem
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # drive-core alone needs no system packages.
      - name: Build the tests
        if: steps.changed.outputs.run == 'true'
        run: cargo test --locked -p drive-core --test adaptive_netem --no-run

      - name: Shaped links
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 15
        run: |
          sudo ip link set lo mtu 1500
          # No 64 KB "super-packets" on loopback: the shaper would drop what exceeds its burst.
          sudo ethtool -K lo tso off gso off gro off 2>/dev/null || true
          run() { DRIVE_NETEM="$1" cargo test --locked -p drive-core --test adaptive_netem -- --ignored --nocapture --test-threads=1; }
          sudo tc qdisc add dev lo root tbf rate 8mbit burst 96kb limit 1000000
          run bloated
          sudo tc qdisc change dev lo root tbf rate 8mbit burst 96kb limit 30000
          run healthy
          sudo tc qdisc del dev lo root

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm through Corepack (bundled with Node), at the version app/package.json pins:
      # seconds, where pnpm/action-setup spends ~20 s installing itself through npm.
      - name: Enable pnpm
        run: corepack enable pnpm && pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
