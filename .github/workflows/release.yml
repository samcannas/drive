name: Release

# Every merge to main ships a release v0.1.<run number>: a Windows installer, Linux .deb and
# AppImage, an Arch package, SHA256SUMS and the updater manifest latest.json.
# Run it by hand (Actions → Release → Run workflow) to retry on main, or on another branch
# to build everything without publishing (a dry run).
on:
  push:
    branches: [main]
    # Changes that can't affect what users install don't ship an (empty) update.
    paths-ignore:
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  CARGO_INCREMENTAL: 0
  # Pinned to the toolchain the team develops with, so clippy/rustfmt in CI match local runs.
  # Bump it deliberately (and fix the new lints) rather than following `stable`.
  RUST_TOOLCHAIN: 1.94.1
  VERSION: 0.1.${{ github.run_number }}

jobs:
  windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    steps:
      # Real-time scanning of every file rustc and the linker write slows builds noticeably.
      - name: Turn off Defender real-time scanning
        shell: pwsh
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ExclusionPath $env:GITHUB_WORKSPACE, $env:USERPROFILE
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath | Format-List

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: started over when LTO was dropped; v0 caches also held the LTO builds.
          prefix-key: v1-rust
          shared-key: release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm through Corepack (bundled with Node), at the version app/package.json pins:
      # seconds, where pnpm/action-setup spends ~20 s installing itself through npm.
      - name: Enable pnpm
        shell: bash
        run: corepack enable pnpm && (cd app && pnpm --version)

      - name: Set version ${{ env.VERSION }}
        shell: bash
        run: .github/release/set-version.sh "$VERSION"

      - name: Build the app, the service and the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # No code-signing certificate: the installer is unsigned (SmartScreen will warn).
        run: .github/release/build-app.sh nsis

      - name: Collect
        shell: bash
        run: |
          exe="target/release/bundle/nsis/Drive_${VERSION}_x64-setup.exe"
          # The installer must carry the service next to the app.
          7z l "$exe" | tr -d '\r' > nsis-contents.txt
          if ! grep -qiE '(^| )drive\.exe$' nsis-contents.txt || ! grep -qiE '(^| )drive-app\.exe$' nsis-contents.txt; then
            cat nsis-contents.txt
            echo "drive.exe or drive-app.exe is missing from the installer" >&2
            exit 1
          fi
          grep -iE '\.exe$' nsis-contents.txt
          mkdir -p dist
          cp "target/release/bundle/nsis/Drive_${VERSION}_x64-setup.exe" dist/
          cp "target/release/bundle/nsis/Drive_${VERSION}_x64-setup.exe.sig" dist/
          ls -l dist target/release/drive.exe target/release/drive-app.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

      # Where the compile time goes, per crate (open the HTML in a browser).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings-windows
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  linux:
    name: Linux x64 (.deb, AppImage, Arch)
    # The oldest supported runner, so the AppImage and the binaries run on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: started over when LTO was dropped; v0 caches also held the LTO builds.
          prefix-key: v1-rust
          shared-key: release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm through Corepack (bundled with Node), at the version app/package.json pins:
      # seconds, where pnpm/action-setup spends ~20 s installing itself through npm.
      - name: Enable pnpm
        shell: bash
        run: corepack enable pnpm && (cd app && pnpm --version)

      - name: Install build dependencies
        timeout-minutes: 15 # mirrors occasionally hang; fail fast instead of stalling the job
        run: |
          # Each attempt is capped; a hung mirror connection is retried instead of blocking.
          apt() { for i in 1 2 3; do sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" && return 0; echo "apt-get $1 failed (attempt $i), retrying"; sleep 10; done; return 1; }
          # Plain-HTTP Ubuntu mirrors (azure.archive / archive / security) are sometimes
          # unreachable from GitHub's runners while HTTPS works: use an HTTPS mirror.
          sudo sed -i -E 's#http://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          # Faster apt on a throwaway runner: no Contents indexes (tens of MB, only for
          # command-not-found), no translations, no man-db rebuild, no fsync per file.
          sudo rm -f /etc/apt/apt.conf.d/50command-not-found /var/lib/man-db/auto-update
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99-no-translations >/dev/null
          apt update
          apt install -y --no-install-recommends -o Dpkg::Options::=--force-unsafe-io \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev             libssl-dev patchelf file

      - name: Set version ${{ env.VERSION }}
        run: .github/release/set-version.sh "$VERSION"

      - name: Build the app, the service and the .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .github/release/build-app.sh deb

      - name: Check the .deb
        run: |
          deb="target/release/bundle/deb/Drive_${VERSION}_amd64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --field "$deb" Depends | grep -q fuse3
          rm -rf pkgroot && mkdir -p pkgroot/root
          dpkg-deb -x "$deb" pkgroot/root
          for f in usr/bin/drive usr/bin/drive-app; do test -x "pkgroot/root/$f"; done
          test -f pkgroot/root/usr/lib/systemd/user/drive.service
          ls pkgroot/root/usr/share/applications/*.desktop
          ls pkgroot/root/usr/share/icons/hicolor/*/apps/
          # Same files for the Arch package (see packaging/arch/PKGBUILD).
          tar -C pkgroot -czf "drive-${VERSION}-x86_64-root.tar.gz" root

      # The Arch package only needs the .deb's files: build it in an Arch container in the
      # background while the AppImage bundles (that takes over a minute), instead of in a
      # separate job that waits for this whole one.
      - name: Start the Arch package (background)
        run: |
          docker run -d --name arch -v "$PWD:/work" -e VERSION archlinux:latest \
            bash /work/.github/release/arch-package.sh

      - name: Bundle the AppImage
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy strips every library it copies into the AppImage; Ubuntu's are
          # already stripped, so that only costs time.
          NO_STRIP: "true"
        run: pnpm tauri bundle --ci --verbose --bundles appimage --config release.conf.json

      - name: Finish the Arch package
        if: always()
        run: |
          code="$(docker wait arch)"
          docker logs arch
          docker rm arch >/dev/null
          test "$code" = 0
          ls -l arch-dist

      - name: Collect
        run: |
          deb="target/release/bundle/deb/Drive_${VERSION}_amd64.deb"
          appimage="target/release/bundle/appimage/Drive_${VERSION}_amd64.AppImage"
          mkdir -p dist
          cp "$deb" "$appimage" "$appimage.sig" arch-dist/*.pkg.tar.zst dist/
          if [ -f "$deb.sig" ]; then cp "$deb.sig" dist/; fi
          ls -l dist target/release/drive target/release/drive-app

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

      # Where the compile time goes, per crate (open the HTML in a browser).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings-linux
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: [windows, linux]
    # Only main publishes; elsewhere the run is a dry run of the builds.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog is built from commits between release tags

      # Only the packages (not the cargo timing reports).
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      - name: Files
        run: ls -l dist

      - name: Changelog
        run: .github/release/changelog.sh "$VERSION" dist

      - name: latest.json, SHA256SUMS and release notes
        run: .github/release/make-release-files.sh "$VERSION" dist

      - name: Publish v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drive ${VERSION}" \
            --notes-file notes.md \
            --latest
